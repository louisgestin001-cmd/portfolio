[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ng-cell-lab"
version = "0.2.0"
description = "Experimental recurrent cells and heterogeneous neural MLP blocks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Louis Gestin"}]
dependencies = [
  "torch>=2.2",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "ruff>=0.6",
]
benchmark = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["experiments/archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
