name: NG Cell Lab CI

on:
  push:
    paths:
      - "projects/ng-cell-lab/**"
      - ".github/workflows/ng-cell-lab-ci.yml"
  pull_request:
    paths:
      - "projects/ng-cell-lab/**"
      - ".github/workflows/ng-cell-lab-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    defaults:
      run:
        working-directory: projects/ng-cell-lab

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/ng-cell-lab/pyproject.toml

      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test]" --no-deps
          python -m pip install pytest ruff

      - name: Lint
        run: ruff check src tests benchmarks

      - name: Test
        run: pytest -q

      - name: Structural diagnostics
        run: python benchmarks/diagnostics.py
