name: NG GuardedAffine CEGIS CI

on:
  push:
    branches:
      - main
      - "research/ng-guarded-affine-cegis-1"
    paths:
      - "projects/ng-guarded-affine-cegis-1/**"
      - ".github/workflows/ng-guarded-affine-cegis-ci.yml"
  pull_request:
    paths:
      - "projects/ng-guarded-affine-cegis-1/**"
      - ".github/workflows/ng-guarded-affine-cegis-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        working-directory: projects/ng-guarded-affine-cegis-1
        run: python -m pip install -e ".[test]"
      - name: Test
        working-directory: projects/ng-guarded-affine-cegis-1
        run: pytest -q
      - name: Smoke benchmark
        working-directory: projects/ng-guarded-affine-cegis-1
        run: python benchmarks/protocol_demo.py
